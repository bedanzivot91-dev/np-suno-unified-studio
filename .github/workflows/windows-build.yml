name: Build NP + Suno Unified Studio

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

# Only the newest validation for the same PR/branch matters. This also kills old smoke tests
# that can otherwise remain hung and block the Windows runner indefinitely.
concurrency:
  group: np-suno-unified-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Deliberately read-only. The original force-delete-studio repository is only checked out as source input.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 240

    steps:
      - name: Checkout unified repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout pinned NP Video Studio source (read-only copy)
        uses: actions/checkout@v4
        with:
          repository: bedanzivot91-dev/force-delete-studio
          ref: 52278e919f6ee0af760241a2666626e3ecb16a03
          path: _sources/np
          persist-credentials: false

      - name: Checkout pinned Suno Pesme Studio source (read-only copy)
        uses: actions/checkout@v4
        with:
          repository: bedanzivot91-dev/force-delete-studio
          ref: v3.3.2.343
          path: _sources/suno
          persist-credentials: false

      - name: Verify source pins
        shell: pwsh
        run: |
          $np = (git -C _sources/np rev-parse HEAD).Trim()
          $suno = (git -C _sources/suno rev-parse HEAD).Trim()
          if ($np -ne '52278e919f6ee0af760241a2666626e3ecb16a03') { throw "Wrong NP source: $np" }
          $tagCommit = (git -C _sources/suno rev-list -n 1 v3.3.2.343).Trim()
          if ($suno -ne $tagCommit) { throw "Wrong Suno tag checkout: HEAD=$suno tag=$tagCommit" }
          Write-Host "NP source:   $np"
          Write-Host "Suno source: $suno (v3.3.2.343)"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Windows media/build dependencies
        shell: pwsh
        run: |
          # Only tools genuinely needed from Chocolatey. yt-dlp and Chromaprint are downloaded
          # as real upstream binaries by the two original release builders; Chocolatey shims are
          # deliberately not used in the unified payload.
          choco install ffmpeg -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Chocolatey FFmpeg install failed.' }
          choco install tesseract -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Chocolatey Tesseract install failed.' }
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 1641 -and $LASTEXITCODE -ne 3010) { throw 'Chocolatey Inno Setup install failed.' }
          "C:\Program Files\Tesseract-OCR" >> $env:GITHUB_PATH
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg did not execute.' }
          ffprobe -version
          if ($LASTEXITCODE -ne 0) { throw 'FFprobe did not execute.' }

      - name: Apply integration only to temporary NP checkout
        shell: pwsh
        run: |
          python scripts/apply_integration.py _sources/np
          python scripts/apply_runtime_fixes.py _sources/np

      - name: Stage and health-test pinned Suno engine
        shell: pwsh
        run: pwsh -File scripts/stage_suno.ps1 -SunoRoot _sources/suno -OutputDir _stage/SunoEngine

      - name: Run complete pinned Suno regression suite (33 tests + import smoke)
        shell: pwsh
        working-directory: _sources/suno
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-core.txt
          if ($LASTEXITCODE -ne 0) { throw 'Installing Suno test dependencies failed.' }

          $stage = Join-Path $env:GITHUB_WORKSPACE '_stage\SunoEngine'
          New-Item -ItemType Directory -Force -Path 'tools\ffmpeg\bin','tools\deno','tools\yt-dlp','plugins\chromaprint' | Out-Null
          Copy-Item -Force (Join-Path $stage 'tools\ffmpeg\bin\ffmpeg.exe') 'tools\ffmpeg\bin\ffmpeg.exe'
          Copy-Item -Force (Join-Path $stage 'tools\ffmpeg\bin\ffprobe.exe') 'tools\ffmpeg\bin\ffprobe.exe'
          Copy-Item -Force (Join-Path $stage 'plugins\chromaprint\fpcalc.exe') 'plugins\chromaprint\fpcalc.exe'
          if (Test-Path (Join-Path $stage 'tools\deno\deno.exe')) { Copy-Item -Force (Join-Path $stage 'tools\deno\deno.exe') 'tools\deno\deno.exe' }
          if (Test-Path (Join-Path $stage 'tools\yt-dlp\yt-dlp.exe')) { Copy-Item -Force (Join-Path $stage 'tools\yt-dlp\yt-dlp.exe') 'tools\yt-dlp\yt-dlp.exe' }

          python tests/import_smoke_test.py
          if ($LASTEXITCODE -ne 0) { throw 'Suno import_smoke_test.py failed.' }

          $tests = @(
            'audio_analysis_test.py','auto_update_test.py','bulk_library_download_test.py','chromaprint_upgrade_test.py',
            'critical_v300.py','duplicate_audio_confirm_test.py','dynamic_library_scale_test.py','fingerprint_index_test.py',
            'http_integration_v300.py','installer_logic_test.py','original_plus_test.py','panako_install_test.py',
            'phase_alignment_test.py','regression_v300.py','release_center_test.py','remote_only_recognition_test.py',
            'short_clip_match_test.py','short_clip_thresholds_test.py','shorts_teaser_test.py','smart_library_test.py',
            'song_finder_remote_source_test.py','song_finder_shortlist_test.py','song_finder_test.py','static_cache_headers_test.py',
            'subtitle_editor_test.py','tempo_extraction_test.py','v3_features_test.py','version_lab_test.py','watchdog_test.py',
            'youtube_channels_test.py','youtube_pipeline_fix_test.py','youtube_scan_test.py','platform_intelligence_test.py'
          )
          $index = 0
          foreach ($test in $tests) {
            $index++
            Write-Host "SUNO TEST $index/$($tests.Count): $test" -ForegroundColor Cyan
            python (Join-Path 'tests' $test)
            if ($LASTEXITCODE -ne 0) { throw "Pinned Suno regression test failed: $test" }
          }
          Write-Host "All $($tests.Count) pinned Suno regression tests + import smoke PASSED." -ForegroundColor Green

      - name: Restore merged NP shell
        working-directory: _sources/np
        run: dotnet restore NPVideoStudio.sln

      - name: Build merged NP shell
        working-directory: _sources/np
        run: dotnet build NPVideoStudio.sln -c Release --no-restore

      - name: Run NP regression tests after integration
        working-directory: _sources/np
        run: dotnet test tests/NPVideoStudio.UnitTests/NPVideoStudio.UnitTests.csproj -c Release --no-build --logger "trx;LogFileName=unified-test-results.trx"

      - name: Build one unified installer + portable package
        shell: pwsh
        working-directory: _sources/np
        env:
          NP_SUNO_ENGINE_STAGE: ${{ github.workspace }}\_stage\SunoEngine
        run: pwsh -File scripts/build-release.ps1

      - name: Validate unified payload really contains both programs
        shell: pwsh
        run: |
          $portable = '_sources\np\dist\NPSunoUnifiedStudio-Portable-x64'
          $requiredFiles = @(
            "$portable\NPVideoStudio.exe",
            "$portable\SunoEngine\python\pythonw.exe",
            "$portable\SunoEngine\app\server.py",
            "$portable\SunoEngine\app\server_core.py",
            "$portable\SunoEngine\app\web\index.html",
            "$portable\SunoEngine\plugins\transcribe_worker.py",
            "$portable\SunoEngine\plugins\stems_worker.py",
            "$portable\SunoEngine\plugins\chromaprint\fpcalc.exe"
          )
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file -PathType Leaf)) { throw "Unified payload missing: $file" }
          }
          $requiredDirs = @(
            "$portable\SunoEngine\plugins\transcription_env\faster_whisper",
            "$portable\SunoEngine\plugins\transcription_env\ctranslate2",
            "$portable\SunoEngine\plugins\stems_env\audio_separator"
          )
          foreach ($dir in $requiredDirs) {
            if (-not (Test-Path $dir -PathType Container)) { throw "Unified payload missing AI component: $dir" }
          }
          $installer = Get-ChildItem '_sources\np\dist\NPSunoUnifiedStudio-Setup-*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Unified installer was not produced.' }
          Write-Host "Unified installer: $($installer.FullName) ($($installer.Length) bytes)"

      - name: Real Windows install + installed runtime + responsive GUI smoke test
        shell: pwsh
        run: pwsh -File scripts/smoke_install.ps1 -DistDir _sources/np/dist

      - name: Second clean install + real functional tools and Suno feature smoke test
        shell: pwsh
        run: pwsh -File scripts/full_functional_install_test.ps1 -DistDir _sources/np/dist

      - name: Upload unified installer
        uses: actions/upload-artifact@v4
        with:
          name: NPSunoUnifiedStudio-Setup
          path: _sources/np/dist/NPSunoUnifiedStudio-Setup-*.exe
          if-no-files-found: error

      - name: Upload unified portable build
        uses: actions/upload-artifact@v4
        with:
          name: NPSunoUnifiedStudio-Portable
          path: _sources/np/dist/NPSunoUnifiedStudio-Portable-x64/**
          if-no-files-found: error
